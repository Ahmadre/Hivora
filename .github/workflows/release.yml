name: Store Release

# Builds & uploads the native apps. Two entry points:
#   1. Push a version tag (v1.2.3)  — the classic trigger.
#   2. Called by the "Release" button workflow (release-button.yml), which bumps
#      the version + creates the tag for you, then invokes this via workflow_call.
# Requires the secrets documented in README.md (Play service account, Apple API
# key, match repo, signing keys).
#
# `submit` picks the Apple lane, and that distinction matters:
#   submit=false → `fastlane beta`    → TestFlight only (pilot). Never creates an
#                  App Store version and never touches the shared App Info, so it
#                  keeps working while an earlier version sits in review.
#   submit=true  → `fastlane release` → deliver: creates the App Store version,
#                  uploads the listing and submits for review. This REQUIRES an
#                  editable app on App Store Connect.
# Running `release` for a plain TestFlight drop is what used to break the Release
# button ("could not find an editable 'App Info'" / "You cannot create a new
# version of the App in the current state") whenever a prior version was still in
# review — App Info is shared by the iOS and macOS platform of one app record, so
# a pending macOS version locks the iOS metadata upload too.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build. Empty = the triggering tag.
        type: string
        required: false
      submit:
        description: >-
          "true" submits to the stores for review (App Store + Mac App Store
          submit_for_review; Play production track). Default uploads drafts only.
        type: string
        required: false
        default: "false"
      platforms:
        description: >-
          "all", or a single platform (android|ios|macos|windows|linux|snap) to
          run just that store. "linux" has no store — it attaches an AppImage to
          the run; "snap" is the Linux store lane.
        type: string
        required: false
        default: all
  # Re-running one store on its own. A failed job can only be re-run with the
  # workflow file of its ORIGINAL run, so a fix to this file never reaches it —
  # dispatching against the same tag does, and rebuilds the identical version.
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag to build, e.g. v10.0.3.
        type: string
        required: true
      platforms:
        description: Which store to run.
        type: choice
        options: [all, android, ios, macos, windows, linux, snap]
        default: all
      submit:
        description: Submit to the store for review (not just upload a draft).
        type: choice
        options: ["false", "true"]
        default: "false"

# Nothing here uses GITHUB_TOKEN: the stores are reached with their own
# credentials from `secrets`, and the artifacts go to the run rather than to a
# release. Spelling that out keeps the token read-only for every job in a file
# that hands third-party actions (flutter-action, setup-ruby, fastlane) a room
# full of signing secrets — without it the workflow runs at whatever the
# repository default happens to be.
permissions:
  contents: read

# One place per file for the SDK version — see the comment on the first
# flutter-action use below.
env:
  FLUTTER_VERSION: 3.47.0

jobs:
  android:
    # Empty on a tag push, where `inputs` does not exist — that path runs all.
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'android' }}
    name: Android → Play ${{ inputs.submit == 'true' && 'production (review)' || 'internal track' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Pinned to an exact SDK, not just `channel: stable`. An unpinned stable
      # drifts underneath the release: a new SDK arrives with a new formatter
      # and new analysis defaults, and a tag that built yesterday fails today
      # with no code change behind it. A release build in particular must be
      # reproducible from its tag, so the version is data in this file, not
      # whatever `stable` resolved to on the day.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Set up Rust for native plugins (16 KB page alignment)
        # cargokit_options.yaml forces the Rust native libs (irondash_engine_context,
        # super_native_extensions) to build from source instead of downloading the
        # maintainer's precompiled binaries, which are only 4 KB-aligned and fail
        # Google Play's 16 KB requirement for Android 15+. Rust >= 1.86 aligns the
        # 64-bit aarch64 target to 16 KB by default; the CARGO_ENCODED_RUSTFLAGS
        # (0x1F-separated) additionally aligns the 32-bit armv7 build.
        run: |
          # ubuntu-latest ships rustup; install it as a fallback if a future
          # runner image drops it (cargokit REQUIRES it — precompiled is disabled).
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          printf 'CARGO_ENCODED_RUSTFLAGS=-C\x1flink-arg=-Wl,-z,max-page-size=16384\x1f-C\x1flink-arg=-Wl,-z,common-page-size=16384\n' >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build & upload via Fastlane
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd android
          bundle exec fastlane internal

  ios:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'ios' }}
    name: iOS → ${{ inputs.submit == 'true' && 'App Store (review)' || 'TestFlight' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - run: flutter pub get
      # Submitting again while a submission is queued REMOVES the version from
      # it and re-queues it at the back — which is how an iOS version can wait
      # for weeks while every macOS release is approved in a day. So when App
      # Review already has us, this run goes to TestFlight instead and leaves
      # the queue position alone. If the check itself fails, nothing changes.
      - name: Is an iOS review already queued?
        id: queue
        if: ${{ inputs.submit == 'true' }}
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          python3 -m venv /tmp/ascvenv
          /tmp/ascvenv/bin/pip -q install requests pyjwt cryptography
          /tmp/ascvenv/bin/python ios/fastlane/review_status.py --queued-platform IOS
      - name: Build & upload via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          SUBMIT: ${{ inputs.submit == 'true' && steps.queue.outputs.queued != 'true' }}
        run: |
          cd ios
          # Publish → deliver (App Store version + listing + submit for review).
          # Release / tag push → pilot (TestFlight only), which is immune to the
          # app being locked by a version that is still in review.
          if [ "$SUBMIT" = "true" ]; then
            bundle exec fastlane release
          else
            echo "TestFlight only (submit=${{ inputs.submit }}, already queued=${{ steps.queue.outputs.queued }})"
            bundle exec fastlane beta
          fi

  macos:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    name: macOS → ${{ inputs.submit == 'true' && 'Mac App Store (review)' || 'TestFlight' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: macos
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Build & upload via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd macos
          # Same split as iOS: TestFlight for a plain release, deliver for publish.
          if [ "$SUBMIT" = "true" ]; then
            bundle exec fastlane release
          else
            bundle exec fastlane beta
          fi

  windows:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    name: Windows → Microsoft Store ${{ inputs.submit == 'true' && '(submitted)' || '(package only)' }}
    # Pinned, not `windows-latest`: in June 2026 both that label AND
    # `windows-2025` were migrated to Visual Studio 2026, whose MSVC 14.5x STL
    # rejects <experimental/coroutine> outright (STL1011) — which is what broke
    # this job. `windows-2022` is the remaining VS 2022 image, i.e. the same
    # compiler generation the app is developed and tested against locally.
    # The release toolchain must not drift underneath a build.
    runs-on: windows-2022
    steps:
      # Before anything expensive: the store credentials are the one thing this
      # job cannot recover from, and the msstore CLI reports their absence as an
      # unreadable argument-parser dump — an empty value simply vanishes from the
      # command line, so the CLI reads the NEXT flag as the previous flag's
      # value ("Cannot parse argument '--sellerId' for option '--tenantId'").
      # Say it in plain words instead, and say it in seconds rather than after a
      # six-minute build.
      - name: Check Store credentials
        if: ${{ inputs.submit == 'true' }}
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          missing=()
          for name in AZURE_AD_TENANT_ID SELLER_ID \
                      AZURE_AD_APPLICATION_CLIENT_ID AZURE_AD_APPLICATION_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All four Microsoft Store secrets are present."
            exit 0
          fi
          echo "Missing repository secrets: ${missing[*]}"
          echo
          echo "Settings → Secrets and variables → Actions. Where each value comes"
          echo "from is listed in release/MANUAL_STEPS_WINDOWS.md (section 3)."
          echo "Publishing also requires the app to be live in the Store already:"
          echo "msstore updates an existing listing, so the FIRST submission is"
          echo "manual (section 2). Windows is the only store affected — the other"
          echo "platforms in this run are unaffected, and the MSIX is still built"
          echo "and attached to the run when submit is off."
          echo "::error title=Microsoft Store credentials missing::${missing[*]} — see release/MANUAL_STEPS_WINDOWS.md section 3"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: windows
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      # Installs the Microsoft Store Developer CLI (msstore) onto the runner.
      - name: Set up Microsoft Store CLI
        if: ${{ inputs.submit == 'true' }}
        uses: microsoft/microsoft-store-apppublisher@v1.1
      # Values go through the environment, never spliced into the command line:
      # an interpolated secret that is empty (or carries a space) rewrites the
      # argument list itself. PowerShell here on purpose — msstore resolves on
      # that PATH.
      #
      # `--option=value`, not `--option value`: an Entra client secret can start
      # with "-" (they do, routinely). As a separate token the parser then reads
      # it as an option name and splits it at the "." — the real failure was
      # "Unrecognized command or argument '.zvYZcS8'". Glued to the option with
      # "=" and quoted, the whole secret stays one argument whatever it contains.
      - name: Authenticate the Store CLI
        if: ${{ inputs.submit == 'true' }}
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: >
          msstore reconfigure
          --tenantId="$env:TENANT_ID"
          --sellerId="$env:SELLER_ID"
          --clientId="$env:CLIENT_ID"
          --clientSecret="$env:CLIENT_SECRET"
      # `reconfigure` only writes a config file — it never contacts the Store —
      # so the first call that proves the credentials is the publish, six
      # minutes of build later, and its "Could not retrieve your application"
      # cannot tell a wrong product id from an account that has no access to it.
      # Listing the account's apps up front answers that: the product appears,
      # or the credentials are pointed at the wrong account. Non-fatal, so it
      # only ever adds information.
      - name: List the apps these credentials can see
        if: ${{ inputs.submit == 'true' }}
        continue-on-error: true
        run: |
          msstore apps list
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning title=Store account exposes no apps::The credentials authenticate, but Partner Center returns no managed applications for them. Check that the Entra app regist[...]
          }
      - name: Build & package (and upload on publish)
        shell: bash
        env:
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd windows
          # Publish → upload to Partner Center and publish the submission.
          # Release / tag push → package only, so the MSIX can be smoke-tested
          # from the run's artifacts without touching the live listing.
          if [ "$SUBMIT" = "true" ]; then
            bundle exec fastlane windows release
          else
            bundle exec fastlane windows build
          fi
      # Also on failure: packaging finishes long before the upload is attempted,
      # so a rejected `msstore publish` still leaves a perfectly good MSIX — and
      # that is exactly the file needed to fall back to a manual Partner Center
      # upload. Throwing it away because the last step failed helps nobody.
      - name: Upload the MSIX as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hinata-msix
          path: build/windows/x64/runner/Release/*.msix
          # warn, not error: the build step is the authority on whether this run
          # failed. If packaging never got that far, this step must not pile a
          # second, misleading failure on top of the real one.
          if-no-files-found: warn
          retention-days: 30

  linux:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    name: Linux → AppImage (run artifact)
    # There is no Linux store lane and `submit` is ignored here on purpose:
    # Flathub publishes from its own repository, not from this workflow, and
    # nothing else asks for an account. What this job owes a release is a file
    # somebody can download and run — so it mirrors the Windows job's fallback
    # half (build, package, attach to the run) and stops there.
    #
    # The Flatpak is NOT built here. packaging/linux/flatpak/com.ahmadre.hinata.yml
    # packages this very same bundle, but doing it in CI means installing
    # flatpak-builder, pulling ~2 GB of org.freedesktop.Platform/Sdk 25.08 and
    # compiling PulseAudio's client tools — minutes of runner time for an
    # artifact nobody consumes until there is a Flathub submission to make.
    # Build it locally from the release artifact when that day comes.
    #
    # Same glibc reasoning as the ci.yml build-linux job: the oldest supported
    # distribution decides the build image, so this is pinned rather than
    # tracking `ubuntu-latest`.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the GTK desktop toolchain
        run: |
          sudo apt-get update
          # Same libunwind conflict the CI Linux job documents: the ubuntu-22.04
          # image's LLVM libunwind-*-dev blocks the GNU libunwind-dev that
          # libgstreamer1.0-dev depends on, and apt installs nothing at all
          # rather than resolving it.
          conflicting=$(dpkg-query -W -f='${db:Status-Status} ${Package}\n' \
            'libunwind-*-dev' 2>/dev/null | awk '$1 == "installed" { print $2 }' || true)
          if [ -n "$conflicting" ]; then
            echo "Removing conflicting: $conflicting"
            sudo apt-get remove -y $conflicting
          fi
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # cargokit compiles super_native_extensions from source on Linux; the
      # runner image ships a toolchain, this only covers one that stops doing so.
      - name: Ensure a Rust toolchain (super_native_extensions)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package as an AppImage
        run: packaging/linux/appimage/build-appimage.sh
      # Both artifacts, and on failure too — the same reasoning as the MSIX
      # above. The raw bundle is what the Flatpak manifest consumes, so a run
      # whose packaging step broke still hands over everything needed to package
      # by hand.
      - name: Upload the AppImage as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hinata-appimage
          path: build/linux/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the raw bundle as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hinata-linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: warn
          retention-days: 30

  snap:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'snap' }}
    name: Snap → Snap Store (${{ matrix.arch }})
    # The Linux store lane. Unlike the AppImage job above this one publishes,
    # because the Snap Store is the channel Hinata ships Linux through.
    #
    # Why a GitHub runner rather than the container the repo already has: the
    # gnome extension the recipe uses pulls the gnome-46-2404 SDK in as a
    # `build-snap`, and nothing can `snap install` inside a Docker container —
    # snapd is a daemon. canonical/action-build installs LXD and the snapcraft
    # snap on the runner, which is the one arrangement where the extension
    # works unmodified.
    #
    # Both architectures build natively; arm64 runners are free for public
    # repositories. No QEMU, no cross-compile — a Flutter build under emulation
    # would take hours and Rust (super_native_extensions) is the part that
    # would suffer most.
    #
    # The runner image does NOT decide the runtime libc here, so the ubuntu-22.04
    # pin the AppImage job needs does not apply: a snap's libc comes from its
    # `base`, and core24 is 24.04 either way.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # snapcraft reads snap/snapcraft.yaml relative to the project directory,
      # and `snap` is a symlink to packaging/linux/snap so the recipe can live
      # with the Flatpak manifest while the repository root stays the project
      # directory. actions/checkout restores symlinks, but a missing one would
      # fail deep inside the build with a confusing "no such file" — so say it
      # here instead.
      - name: Check the snap/ symlink survived checkout
        run: |
          test -L snap || { echo "snap/ is not a symlink"; exit 1; }
          test -f snap/snapcraft.yaml || { echo "snap/snapcraft.yaml missing"; exit 1; }
      - name: Build the snap
        id: build
        uses: canonical/action-build@v1.3.0
      # A snap that builds is not a snap that runs: strict confinement is
      # applied at INSTALL time, not at build time, so every mistake in the
      # plug list, the staged GStreamer plugins or the layout only shows up
      # here. This runner is a real Ubuntu with snapd, which is the whole
      # reason to test before publishing rather than after.
      - name: Install it the way a user would
        run: |
          # The content snaps the recipe's interfaces connect to. snapd pulls
          # a default provider automatically for store installs only, so a
          # --dangerous install of a local file needs them by hand.
          sudo snap install gnome-46-2404 mesa-2404 gtk-common-themes
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          # Neither of these auto-connects — that is the documented cost of the
          # two features behind them, and connecting them here proves the plugs
          # are spelled right and the interfaces exist.
          sudo snap connect hinata:password-manager-service
          sudo snap connect hinata:audio-record
          snap connections hinata
      - name: Smoke-test it under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11
          # No server is configured, so the app lands on its connect screen —
          # which is exactly the assertion worth making: reaching a drawn
          # window means the confined GTK stack resolved, the Flutter engine
          # started and nothing died on a missing library. Anything past that
          # needs a server and belongs in the app's own test suite.
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          dbus-run-session -- snap run hinata > /tmp/hinata.log 2>&1 &
          app=$!
          # Poll rather than sleep-and-hope: a window that never appears should
          # fail fast with the log, not after a fixed wait.
          for i in $(seq 1 40); do
            if xdotool search --onlyvisible --name . 2>/dev/null | grep -q .; then
              echo "A window appeared after ${i}s."
              found=1
              break
            fi
            kill -0 "$app" 2>/dev/null || { echo "The app exited early."; break; }
            sleep 1
          done
          if [ "${found:-0}" != "1" ]; then
            echo "::error::hinata drew no window under Xvfb"
            cat /tmp/hinata.log
            exit 1
          fi
          kill "$app" 2>/dev/null || true
      - name: Upload the snap as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hinata-snap-${{ matrix.arch }}
          path: ./*.snap
          if-no-files-found: warn
          retention-days: 30
      # `submit` means the same thing here as it does for the other stores: off,
      # this uploads where the team can reach it and users cannot. The Snap
      # Store has no review queue, so "submitting" is simply releasing to
      # stable, and it is instant and public — which is why it stays opt-in.
      - name: Publish to the Snap Store
        if: ${{ steps.build.outcome == 'success' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "No store credentials configured — keeping the run artifact only."
            exit 0
          fi
          channel=edge
          if [ "${{ inputs.submit }}" = "true" ]; then
            channel=stable
          fi
          echo "Releasing to $channel"
          sudo snap install snapcraft --classic
          snapcraft upload --release="$channel" "${{ steps.build.outputs.snap }}"
