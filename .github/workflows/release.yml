name: Store Release

# Builds & uploads the native apps. Two entry points:
#   1. Push a version tag (v1.2.3)  — the classic trigger.
#   2. Called by the "Release" button workflow (release-button.yml), which bumps
#      the version + creates the tag for you, then invokes this via workflow_call.
# Requires the secrets documented in README.md (Play service account, Apple API
# key, match repo, signing keys).
#
# `submit` picks the Apple lane, and that distinction matters:
#   submit=false → `fastlane beta`    → TestFlight only (pilot). Never creates an
#                  App Store version and never touches the shared App Info, so it
#                  keeps working while an earlier version sits in review.
#   submit=true  → `fastlane release` → deliver: creates the App Store version,
#                  uploads the listing and submits for review. This REQUIRES an
#                  editable app on App Store Connect.
# Running `release` for a plain TestFlight drop is what used to break the Release
# button ("could not find an editable 'App Info'" / "You cannot create a new
# version of the App in the current state") whenever a prior version was still in
# review — App Info is shared by the iOS and macOS platform of one app record, so
# a pending macOS version locks the iOS metadata upload too.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build. Empty = the triggering tag.
        type: string
        required: false
      submit:
        description: >-
          "true" submits to the stores for review (App Store + Mac App Store
          submit_for_review; Play production track). Default uploads drafts only.
        type: string
        required: false
        default: "false"

jobs:
  android:
    name: Android → Play ${{ inputs.submit == 'true' && 'production (review)' || 'internal track' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Set up Rust for native plugins (16 KB page alignment)
        # cargokit_options.yaml forces the Rust native libs (irondash_engine_context,
        # super_native_extensions) to build from source instead of downloading the
        # maintainer's precompiled binaries, which are only 4 KB-aligned and fail
        # Google Play's 16 KB requirement for Android 15+. Rust >= 1.86 aligns the
        # 64-bit aarch64 target to 16 KB by default; the CARGO_ENCODED_RUSTFLAGS
        # (0x1F-separated) additionally aligns the 32-bit armv7 build.
        run: |
          # ubuntu-latest ships rustup; install it as a fallback if a future
          # runner image drops it (cargokit REQUIRES it — precompiled is disabled).
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          printf 'CARGO_ENCODED_RUSTFLAGS=-C\x1flink-arg=-Wl,-z,max-page-size=16384\x1f-C\x1flink-arg=-Wl,-z,common-page-size=16384\n' >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build & upload via Fastlane
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd android
          bundle exec fastlane internal

  ios:
    name: iOS → ${{ inputs.submit == 'true' && 'App Store (review)' || 'TestFlight' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - run: flutter pub get
      - name: Build & upload via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd ios
          # Publish → deliver (App Store version + listing + submit for review).
          # Release / tag push → pilot (TestFlight only), which is immune to the
          # app being locked by a version that is still in review.
          if [ "$SUBMIT" = "true" ]; then
            bundle exec fastlane release
          else
            bundle exec fastlane beta
          fi

  macos:
    name: macOS → ${{ inputs.submit == 'true' && 'Mac App Store (review)' || 'TestFlight' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: macos
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Build & upload via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd macos
          # Same split as iOS: TestFlight for a plain release, deliver for publish.
          if [ "$SUBMIT" = "true" ]; then
            bundle exec fastlane release
          else
            bundle exec fastlane beta
          fi
