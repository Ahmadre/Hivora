name: App Store auto-release

# Watches App Store Connect and finishes an Apple release without a human in the
# loop. Three decisions, re-derived from Apple on every run, each a no-op unless
# its precondition holds:
#
#   1. iOS is PENDING_DEVELOPER_RELEASE  → press "Release this version".
#      Versions are created with automatic_release: false (ios/fastlane/Fastfile),
#      which keeps approval and going-live as two separate decisions. The cost is
#      that an approved version does nothing at all until somebody opens App Store
#      Connect. Apple approves when Apple approves, regularly overnight.
#
#   2. iOS is live and the follow-up version has no tag yet → run the same
#      "Publish (button)" workflow a person would, shipping all five platforms.
#      The order is forced, not a preference: while a version sits in
#      PENDING_DEVELOPER_RELEASE, App Store Connect refuses to create a new
#      version and serves the App Info read-only (LOCKED_APP_HINT in
#      ios/fastlane/Fastfile), so publishing before releasing cannot work.
#
#   3. The follow-up version is itself live → the job is done; switch the
#      schedule off. Note this is deliberately NOT "the tag exists": step 2
#      submits the follow-up for review, and that submission needs its own press
#      of the button in step 1. Disabling at the tag would strand it.
#
# Why it calls release-publish.yml with `uses:` rather than dispatching it:
# events raised with GITHUB_TOKEN deliberately do not start new workflow runs, so
# `gh workflow run` from inside Actions would silently do nothing. Calling it
# needs no personal access token — and the repo has none — and it is how
# release-button.yml and release-publish.yml already reach release.yml.
#
# Step 2 has a switch in front of it — the `gate` job below. Left alone it passes
# through and the release is unattended; give the `production-release`
# environment a required reviewer and the same run waits for one click instead.
#
# Scope, honestly: this automates the APPLE side. Step 2 starts every store, but a
# green run is not five shipped stores — iOS can quietly fall back to TestFlight,
# a snap can sit in store review, Windows certification can reject. Check with
# `python tool/store_status.py` afterwards rather than trusting the check mark.
on:
  schedule:
    # Every quarter hour. GitHub delays scheduled runs under load, so read this
    # as "within the hour" rather than a promise — still far better than a button
    # that waits until somebody wakes up.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would happen and change nothing.
        type: choice
        options: ["true", "false"]
        default: "true"
      platform:
        description: Which Apple platform to watch.
        type: choice
        options: [IOS, MAC_OS]
        default: IOS

# The two facts this watcher is set up for. They live here rather than in
# repository variables because the repo has none, and an unset variable would
# silently widen `--expect-version` from "these two releases" to "anything Apple
# happens to approve" — a safety rail that disappears when you forget to set it
# is worse than no safety rail at all.
env:
  # Every version this watcher may push to the public store. iOS 10.1.0 is the
  # one currently waiting; 10.2.0 is the follow-up, and it needs the button
  # pressed for it too once Apple approves it.
  RELEASABLE_VERSIONS: '10.1.0,10.2.0'
  # The release to publish once iOS is live. Empty = only press the button.
  FOLLOW_UP_VERSION: '10.2.0'

permissions:
  contents: read

# Never two runs pressing at once. Not cancelling in-progress: a run that is
# midway through publishing five stores must finish, and a skipped watch costs
# only fifteen minutes.
concurrency:
  group: appstore-auto-release
  cancel-in-progress: false

jobs:
  watch:
    name: Check App Store Connect
    runs-on: ubuntu-latest
    # Four requests to Apple and a git tag lookup. If it is still going after
    # ten minutes something is wedged, and the default six hours would hold the
    # concurrency group — and with it every later run — for a quarter of a day.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      state: ${{ steps.asc.outputs.state }}
      version: ${{ steps.asc.outputs.version }}
      released: ${{ steps.asc.outputs.released }}
      live: ${{ steps.asc.outputs.live }}
      blocked: ${{ steps.asc.outputs.blocked }}
      needs_publish: ${{ steps.gate.outputs.needs_publish }}
      finished: ${{ steps.gate.outputs.finished }}
      # `with:` on a reusable-workflow call cannot read the `env` context —
      # only github/inputs/needs/vars/matrix/strategy. So the version travels
      # as an output. Get this wrong and the call silently passes an empty
      # string, release-publish falls back to a patch bump, and 10.1.1 ships
      # where 10.2.0 was meant to.
      follow_up: ${{ steps.gate.outputs.follow_up }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags say whether the follow-up release has already gone out, and a
          # shallow checkout has none — but the history behind them is dead
          # weight here. `fetch-tags` gets the refs without it; `fetch-depth: 0`
          # would pull every commit of this repository, four times an hour, to
          # answer one `git rev-parse`.
          fetch-depth: 1
          fetch-tags: true
          # This job reads local tags and never pushes, so it has no use for git
          # credentials — and leaving them in .git/config puts GITHUB_TOKEN in
          # reach of every dependency's install hook, in the one job that also
          # holds the App Store Connect key.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ios/fastlane/requirements.txt
      - run: pip install -r ios/fastlane/requirements.txt

      - name: Release the approved version, if there is one
        id: asc
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          # Through the environment, not spliced into the command line: a `${{ }}`
          # inside `run:` is pasted in before bash ever sees it, and this script
          # publishes to a public app store.
          PLATFORM: ${{ inputs.platform || 'IOS' }}
          # The schedule is what acts. A hand-started run reports by default, so
          # a curious click cannot ship anything.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--platform "$PLATFORM" --expect-version "$RELEASABLE_VERSIONS")
          if [ "${DRY_RUN:-}" = "true" ]; then
            args+=(--dry-run)
          fi
          python ios/fastlane/auto_release.py "${args[@]}"

      - name: Decide what is left to do
        id: gate
        env:
          LIVE: ${{ steps.asc.outputs.live }}
          VERSION: ${{ steps.asc.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Which platform the step above actually looked at. Without it this
          # step would happily conclude "live, ship everything" from a macOS
          # observation — and macOS clears review days before iOS does, so that
          # is not a hypothetical ordering.
          PLATFORM: ${{ inputs.platform || 'IOS' }}
        run: |
          set -euo pipefail
          needs=false
          finished=false

          # Highest of the two version numbers. `finished` must not require an
          # exact match: once a 10.3.0 record exists the watched version is no
          # longer the follow-up, and an equality test would leave the schedule
          # running four times an hour for nothing, forever.
          newest=$(printf '%s\n%s\n' "$VERSION" "$FOLLOW_UP_VERSION" | sort -V | tail -1)

          if [ "$PLATFORM" != "IOS" ]; then
            # Both decisions below are about the iOS release train. A run pointed
            # at another platform is a look, not a step in it.
            echo "Watching $PLATFORM — reporting only; the release train is iOS."
          elif [ "$LIVE" = "true" ] && [ "$newest" = "$VERSION" ] && [ "$DRY_RUN" != "true" ]; then
            # The follow-up is on the store, or something newer is. Nothing this
            # workflow does can add anything from here.
            echo "iOS $VERSION is live — this watcher has finished its job."
            finished=true
          elif [ "$LIVE" != "true" ]; then
            echo "iOS is not on the store yet — nothing to publish on top of it."
          elif [ -z "$FOLLOW_UP_VERSION" ]; then
            echo "No follow-up version configured — this watcher only presses the button."
          elif git rev-parse "v$FOLLOW_UP_VERSION" >/dev/null 2>&1; then
            # The tag is the record that the publish RAN, not that it worked:
            # release-publish tags before it builds anything. Checking it rather
            # than remembered state is still what keeps this idempotent — the
            # publish refuses a duplicate tag, so without the gate every run
            # after the first would fail, four times an hour. But it means the
            # watcher goes quiet after a publish whose build failed, so say so
            # rather than reporting a release nobody verified.
            echo "v$FOLLOW_UP_VERSION is tagged — a publish has run."
            echo "Whether all five stores took it is a separate question:"
            echo "  python tool/store_status.py --expect $FOLLOW_UP_VERSION"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would publish $FOLLOW_UP_VERSION now (and then stand down)."
          else
            echo "iOS is live and v$FOLLOW_UP_VERSION is untagged — publishing $FOLLOW_UP_VERSION."
            needs=true
          fi

          {
            echo "needs_publish=$needs"
            echo "finished=$finished"
            echo "follow_up=$FOLLOW_UP_VERSION"
          } >> "$GITHUB_OUTPUT"

      # Only the headline. auto_release.py already writes the explanation for
      # any state worth explaining, and it knows which state it saw — saying it
      # twice here is how the two copies drift until one of them is wrong.
      - name: Say what happened
        if: ${{ steps.asc.outputs.blocked != 'true' }}
        env:
          STATE: ${{ steps.asc.outputs.state }}
          VERSION: ${{ steps.asc.outputs.version }}
          PLATFORM: ${{ inputs.platform || 'IOS' }}
        run: |
          echo "### $PLATFORM \`$VERSION\` → \`$STATE\`" >> "$GITHUB_STEP_SUMMARY"

  # A version going live is the one moment somebody wants to hear about, and a
  # workflow that merely succeeds notifies nobody. An issue does — and since the
  # version leaves PENDING_DEVELOPER_RELEASE the instant it is pressed, this
  # fires exactly once per release.
  announce:
    name: Open an issue about the release
    needs: watch
    if: ${{ needs.watch.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.watch.outputs.version }}
          # A hand-started run can watch macOS, and then this is a Mac App Store
          # release. Saying "iOS" either way would be a wrong title on the one
          # notification anybody actually reads.
          PLATFORM: ${{ inputs.platform || 'IOS' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            MAC_OS) store="Mac App Store" ;;
            *)      store="App Store" ;;
          esac
          # One quoted argument per line rather than a multi-line string: inside a
          # YAML block scalar every continuation line carries this block's
          # indentation, and ten leading spaces turn each paragraph into a
          # Markdown code block.
          body=$(printf '%s\n' \
            "Apple approved \`$VERSION\` and this workflow pressed the release button." \
            "" \
            "Apple processes it for distribution now; it appears on the store within a few hours." \
            "" \
            "Next, once it reports as live: \`$FOLLOW_UP_VERSION\` goes to all five platforms. Check what actually shipped with \`python tool/store_status.py --expect $FOLLOW_UP_VERSION\` — a green release run is not the same as five stores serving the new version." \
            "" \
            "[Workflow run]($RUN)")
          gh issue create \
            --title "$VERSION is on its way to the $store" \
            --body "$body"

  # A switch, not a speed bump. The decision to ship the follow-up automatically
  # was made in the pull request that set FOLLOW_UP_VERSION — but what gets built
  # is whatever is on main at the moment Apple happens to approve, chosen by
  # Apple's clock rather than by a person. With no protection rules on the
  # `production-release` environment this job passes straight through and the
  # release stays unattended, which is the point. Add required reviewers to that
  # environment in Settings and the same run waits for one approval instead —
  # no code change, and it can be switched either way between releases.
  #
  # It exists as its own job because `environment:` is not one of the keys a
  # reusable-workflow call accepts; the gate has to sit in front of it.
  gate:
    name: Approve shipping to five stores
    needs: watch
    if: ${{ needs.watch.outputs.needs_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-release
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.watch.outputs.follow_up }}
          SHA: ${{ github.sha }}
        run: |
          echo "Shipping $VERSION to Android, iOS, macOS, Windows and Linux." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Watcher ran at \`$SHA\`; release-publish builds the tip of main." \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the follow-up release
    needs: [watch, gate]
    if: ${{ needs.watch.outputs.needs_publish == 'true' }}
    # The very workflow the Actions tab's "Publish (button)" runs: bump,
    # changelog, tag, then build and submit every store.
    uses: ./.github/workflows/release-publish.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      version: ${{ needs.watch.outputs.follow_up }}

  # Same self-limiting pattern store-listing-windows-retry.yml uses: a scheduled
  # workflow that knows when it is done turns itself off rather than running
  # forever. Turn it back on in Actions → this workflow → "Enable workflow".
  stand_down:
    name: Switch the schedule off
    needs: watch
    if: ${{ needs.watch.outputs.finished == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Through `env:` like every other value in this file. Neither of these is
      # attacker-controllable — `github.workflow` is this file's own `name:` —
      # but this is the one job holding `actions: write`, and it is the shape
      # the next person copies.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          gh workflow disable "$WORKFLOW"
          echo "Disabled — iOS is live on the target version." >> "$GITHUB_STEP_SUMMARY"
