name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

# One place per file for the SDK version — see the comment on the first
# flutter-action use below.
env:
  FLUTTER_VERSION: 3.47.0

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to an exact SDK, not just `channel: stable`. An unpinned stable
      # moves underneath the repository: a new SDK brings a new formatter and a
      # new set of analysis defaults, so a run that passed yesterday fails today
      # with nobody having changed a line of code. This repository has been
      # bitten by exactly that. Bump FLUTTER_VERSION deliberately, in its own
      # commit, so the red run points at the bump.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: Build Web
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: hinata-web
          path: build/web

  build-linux:
    name: Build Linux
    needs: quality
    # Pinned, not `ubuntu-latest`: a Flutter Linux bundle is dynamically linked
    # against the glibc it was built on, and glibc only guarantees forward
    # compatibility. A binary built on a newer runner therefore refuses to start
    # on an older distribution ("GLIBC_2.39 not found") while the same source
    # built here runs everywhere from Ubuntu 22.04 up. The floor belongs in the
    # build definition, not in whatever image GitHub happens to point the
    # `latest` label at this month — the same reasoning the Windows release job
    # pins `windows-2022` for.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Listed one by one rather than pulled in through a meta-package, because
      # each of these is here for a specific plugin and a missing one fails at
      # CMake configure time with a pkg-config error that names the .pc file
      # instead of the feature:
      #   libgtk-3-dev ............ the embedder itself
      #   liblzma-dev, libjsoncpp-dev  the Flutter tool's Linux toolchain
      #   libsecret-1-dev ......... flutter_secure_storage_linux (session tokens)
      #   libgstreamer*-dev ....... just_audio_linux (voice-comment playback)
      # `printing` additionally needs gtk+-unix-print-3.0, which ships inside
      # libgtk-3-dev.
      - name: Install the GTK desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # super_native_extensions (rich clipboard + drag & drop) is a Rust crate,
      # and cargokit compiles it from source on Linux — the project publishes
      # precompiled binaries for Android only, so `flutter build linux` really
      # does invoke cargo. The runner image ships a toolchain; this only covers
      # a future image that drops it, exactly like the Android release job.
      - name: Ensure a Rust toolchain (super_native_extensions)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: hinata-linux
          path: build/linux/x64/release/bundle

  docker:
    name: Publish Web Docker image
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=bear,enable={{is_default_branch}}
      # Generic web image — NO backend is baked in. The default server is set
      # at deployment via the HINATA_DEFAULT_SERVER container env (see Dockerfile
      # + deploy/docker-entrypoint.d). One image serves every deployment; the
      # :bear tag is now just an alias of the same generic build (asta + bear
      # differ only by the env each stack's compose sets). Tags: semver (v* tags)
      # + :latest and :bear (main).
      - name: Build & push generic web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redeploy asta + bear (ASTASRV01)
    needs: docker
    # Only on a real push to main — never on tags or PRs (the self-hosted runner
    # has the host docker socket, so it must not run untrusted/fork code).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, astasrv01]
    steps:
      - name: Surgical redeploy of hinata-app (asta + bear)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each stack pulls its OWN freshly-built web image and recreates ONLY the
          # app container (--no-deps leaves server + databases untouched). Each
          # compose pins its own image tag, so `pull hinata-app` fetches :latest for
          # asta and :bear for bear. Stack dirs on ASTASRV01:
          #   asta -> /opt/stacks/hinata       (project "hinata",      inline values)
          #   bear -> /opt/stacks/hinata-bear  (project "hinata-bear", loads its .env)
          #
          # GENERIC IMAGE: it bakes NO backend. Each stack's hinata-app service
          # MUST set the server via env, else the app opens the connect screen:
          #   asta compose:  environment: [ "HINATA_DEFAULT_SERVER=https://api.track.asta.hn" ]
          #   bear compose:  environment: [ "HINATA_DEFAULT_SERVER=https://api.track.bear.ahmadre.com" ]
          for STACK in hinata hinata-bear; do
            echo "::group::redeploy $STACK (app)"
            docker run --rm \
              -e GHCR_USER -e GHCR_TOKEN -e STACK="$STACK" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "/opt/stacks/$STACK:/work" -w /work \
              docker:cli sh -euc '
                echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                docker compose -p "$STACK" pull hinata-app
                docker compose -p "$STACK" up -d --no-deps --force-recreate hinata-app
                docker logout ghcr.io'
            echo "::endgroup::"
          done
