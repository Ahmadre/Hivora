name: Windows listing (screenshots)

# Pushes the Microsoft Store listing screenshots in windows/store/screenshots
# into the pending Partner Center submission — for every listing language —
# and optionally commits it, which starts certification.
#
#   Actions tab → "Windows listing (screenshots)" → Run workflow
#
# Listing content (screenshots, captions) is out of reach for `msstore publish`,
# which only uploads packages; this uses the Store submission API with the same
# Entra credentials. See release/MANUAL_STEPS_WINDOWS.md for how those secrets
# were created.
#
# A submission that is currently being ingested (pre-processing, certification,
# publishing) cannot be edited — the API answers 409 InvalidState. With
# `tolerate_busy` that is reported instead of failing the run, which is how the
# companion retry workflow keeps trying until the Store lets the edit through.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Listing languages (comma-separated, empty = all)'
        type: string
        default: 'en-us,de-de'
      commit:
        description: 'Commit the submission (starts certification)'
        type: boolean
        default: true
      dry_run:
        description: 'Only report what would change'
        type: boolean
        default: false
      tolerate_busy:
        description: 'Do not fail if the submission is locked by an ingestion run'
        type: boolean
        default: false
  workflow_call:
    inputs:
      languages:
        type: string
        default: 'en-us,de-de'
      commit:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      tolerate_busy:
        type: boolean
        default: false
    outputs:
      outcome:
        description: 'already-applied · dry-run · busy · uploaded · committed'
        value: ${{ jobs.listing.outputs.outcome }}
    secrets:
      AZURE_AD_TENANT_ID:
        required: true
      AZURE_AD_APPLICATION_CLIENT_ID:
        required: true
      AZURE_AD_APPLICATION_SECRET:
        required: true

jobs:
  listing:
    name: Update store listing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.listing.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Update listing screenshots
        id: listing
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          LANGUAGES: ${{ inputs.languages }}
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
          TOLERATE_BUSY: ${{ inputs.tolerate_busy }}
        run: |
          flags=""
          if [ "$COMMIT" = "true" ]; then flags="$flags --commit"; fi
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          if [ "$TOLERATE_BUSY" = "true" ]; then flags="$flags --tolerate-busy"; fi
          python windows/store/update_listing.py --languages "$LANGUAGES" $flags
