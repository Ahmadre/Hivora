name: just_audio_linux
description: Linux (GStreamer) playback implementation of just_audio, for hinata.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.3
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio_platform_interface: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: JustAudioLinuxPlugin
        dartPluginClass: JustAudioLinux
