# Flatpak manifest for the Linux desktop build.
#
# This packages a bundle that was ALREADY built — it does not build Flutter
# inside the sandbox. Run, from the repository root:
#
#   flutter build linux --release
#   flatpak-builder --force-clean --user --install \
#     build/flatpak packaging/linux/flatpak/com.ahmadre.hinata.yml
#
# Two reasons for the prebuilt approach, and the second one is the important
# one. First, the Flutter SDK is not a Flatpak module: it downloads its own
# engine artefacts on demand and a flatpak-builder build runs with no network.
# Second, `printing`'s linux/CMakeLists.txt fetches pdfium at CMake *configure*
# time — download_project(PROJ pdfium URL https://github.com/bblanchon/
# pdfium-binaries/releases/download/chromium/5200/pdfium-linux-<arch>.tgz),
# unpacked into <build>/pdfium-src — so configuring the project inside the
# sandbox would fail outright.
#
# Packaging the bundle sidesteps both: the download happens during the ordinary
# `flutter build linux --release` on a machine that has network, and pdfium ends
# up inside the bundle, because printing's CMakeLists exports the downloaded
# library through `printing_bundled_libraries` and the runner installs every
# PLUGIN_BUNDLED_LIBRARIES entry into bundle/lib. Verified, not assumed — a
# release build in the CI image produces:
#
#   build/linux/<arch>/release/bundle/lib/libpdfium.so   5.7 MB
#
# so there is nothing left to pre-fetch here and no `sources:` entry for it.
app-id: com.ahmadre.hinata

# 25.08 is the current stable Freedesktop runtime: the branch is published every
# August with a two-year support window, so 25.08 is supported until Aug 2027,
# while 26.08 was still at beta.3 when this manifest was written. It is also the
# runtime that happens to carry almost everything the app shells out to —
# gtk3, zenity, gstreamer (base/good/bad/ugly/libav), libsecret and ffmpeg are
# all elements of the platform image (elements/platform.bst upstream), which is
# why the modules list below is one entry long instead of five.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hinata

finish-args:
  # Wayland first, X11 only when there is no Wayland compositor. Deliberately
  # NOT `--socket=x11` alongside `--socket=wayland`: that grants X11 access even
  # on a Wayland session, where it is a way out of the sandbox (any X client can
  # read any other client's input). `fallback-x11` is the same capability
  # without the hole.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory needs the host IPC namespace; without it the X11 fallback
  # path renders at a crawl.
  - --share=ipc
  # GPU access. Flutter's Linux embedder renders through OpenGL, and without
  # /dev/dri it falls back to llvmpipe — technically working, visibly slow with
  # the glass surfaces this UI is built from.
  - --device=dri
  # The whole app is a client for a self-hosted server the user names at first
  # start, so there is no host to narrow this to.
  - --share=network
  # Voice comments, both directions: record_linux captures through parecord and
  # just_audio_linux plays back through GStreamer's pulsesink.
  - --socket=pulseaudio
  # flutter_secure_storage_linux talks to the login keyring over libsecret,
  # which is a D-Bus client of org.freedesktop.secrets on the HOST. Without this
  # the app cannot persist a session and every restart lands on the login
  # screen. (The Secret portal is not an alternative here — libsecret uses the
  # service directly.)
  - --talk-name=org.freedesktop.secrets
  # Attachments. file_picker 8.3.7 has no portal path on Linux: its Linux
  # implementation is pure Dart and shells out to zenity/qarma/kdialog, which
  # run INSIDE the sandbox and therefore only ever show the sandbox's view of
  # the filesystem. So picking a file to upload needs real read access.
  #
  # The user's document folders, and deliberately NOT `home:ro`. Read access to
  # the whole home directory is read access to ~/.ssh, ~/.gnupg, the browser
  # profiles and every dotfile besides — none of which is ever an attachment,
  # and all of which a single memory-safety bug in something this app decodes
  # (a GStreamer voice comment, a pdfium preview, an image) would be able to
  # reach and upload. The sandbox is what stands between a bad attachment and
  # the user's keys, and `home:ro` removes most of it in exchange for being
  # able to pick a file out of a folder XDG does not name. Someone who keeps
  # attachments somewhere else can copy them into one of these.
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-desktop:ro
  #
  # (Photo/video picking is different and needs nothing: image_picker_linux goes
  # through file_selector_linux, i.e. GtkFileChooserNative, which the portal
  # takes over automatically when sandboxed.)
  #
  # Downloads are the one thing the app writes: share_plus throws
  # UnimplementedError for files on Linux, so a downloaded attachment is written
  # straight into the XDG Downloads directory. `create` so a machine without one
  # still works.
  - --filesystem=xdg-download:create
  #
  # Deliberately NOT granted:
  #   --talk-name=org.freedesktop.Notifications — the Linux build has no
  #     notification path at all (firebase_messaging has no Linux
  #     implementation and no local-notification plugin is used), so the
  #     permission would sit in the app's permission list doing nothing.
  #   --device=all / --device=camera — `camera` has no Linux implementation,
  #     so webcam capture is not offered on this platform.
  #   --filesystem=host / --filesystem=home — see the xdg-* entries above; the
  #     picker only needs to read the folders documents actually live in, and
  #     neither system paths nor the user's dotfiles are an attachment source.

modules:
  # record_linux 1.3.1 records by piping `parecord` into `ffmpeg`, and also
  # calls `pactl` to enumerate input devices. ffmpeg IS part of the Freedesktop
  # platform; the PulseAudio *tools* are not — the runtime's libpulse element
  # builds with `-Ddaemon=false` and ships only libpulse.so / libpulse-simple.so
  # / libpulse-mainloop-glib.so, no binaries. So without this module the mic
  # button would open, fail to spawn parecord, and record nothing.
  #
  # Built with the daemon and every optional backend off: all we want out of
  # this source tree are the three client binaries.
  - name: pulseaudio-utils
    buildsystem: meson
    config-opts:
      - -Ddaemon=false
      - -Ddoxygen=false
      - -Dman=false
      - -Dtests=false
      - -Dgsettings=disabled
      - -Dglib=disabled
      - -Dgtk=disabled
      - -Dx11=disabled
      - -Ddbus=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dbluez5=disabled
      - -Davahi=disabled
      - -Dasyncns=disabled
      - -Dopenssl=disabled
      - -Dsystemd=disabled
      - -Dudev=disabled
      - -Delogind=disabled
      - -Dgstreamer=disabled
      - -Dfftw=disabled
      - -Dorc=disabled
      - -Dsoxr=disabled
      - -Dspeex=disabled
      - -Dsamplerate=disabled
      - -Dwebrtc-aec=disabled
      - -Dlirc=disabled
      - -Dvalgrind=disabled
    # The build also produces libpulse itself, which then shadows the runtime's
    # copy for everything in the sandbox (/app/lib comes first). That is the
    # same upstream library at the same ABI, so it is harmless — but it is the
    # reason the version below should be moved forward deliberately rather than
    # tracked loosely.
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /share/bash-completion
      - /share/zsh
      - '*.la'
    sources:
      - type: archive
        url: https://freedesktop.org/software/pulseaudio/releases/pulseaudio-17.0.tar.xz
        sha256: 053794d6671a3e397d849e478a80b82a63cb9d8ca296bd35b73317bb5ceb87b5

  - name: hinata
    buildsystem: simple
    # The bundle is already compiled, stripped as the release build left it, and
    # its plugin libraries carry an RPATH of $ORIGIN/lib. Letting flatpak-builder
    # strip them again and split out debuginfo only risks disturbing that.
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      # The Flutter runner locates data/flutter_assets and lib/ RELATIVE to the
      # resolved path of its own executable, so the bundle has to stay together
      # as one directory. /app/bin/hinata is a symlink into it: ld.so expands
      # $ORIGIN after resolving symlinks, so the rpath still points at
      # /app/hinata/lib.
      - mkdir -p /app/hinata
      - cp -a bundle/. /app/hinata/
      - install -d /app/bin
      - ln -s ../hinata/hinata /app/bin/hinata
      - install -Dm644 com.ahmadre.hinata.desktop
        /app/share/applications/com.ahmadre.hinata.desktop
      - install -Dm644 com.ahmadre.hinata.metainfo.xml
        /app/share/metainfo/com.ahmadre.hinata.metainfo.xml
      - install -Dm644 com.ahmadre.hinata.png
        /app/share/icons/hicolor/512x512/apps/com.ahmadre.hinata.png
    sources:
      # `flutter build linux` writes to build/linux/<arch>/release/bundle, and
      # the arch name is Flutter's (x64 / arm64), not Flatpak's — hence two
      # sources gated on the target architecture rather than one path.
      - type: dir
        path: ../../../build/linux/x64/release/bundle
        dest: bundle
        only-arches: [x86_64]
      - type: dir
        path: ../../../build/linux/arm64/release/bundle
        dest: bundle
        only-arches: [aarch64]
      # Shared with the AppImage recipe — one desktop entry, one icon, one
      # metainfo file for every format.
      - type: file
        path: ../com.ahmadre.hinata.desktop
      - type: file
        path: ../com.ahmadre.hinata.metainfo.xml
      - type: file
        path: ../icons/hicolor/512x512/apps/com.ahmadre.hinata.png
